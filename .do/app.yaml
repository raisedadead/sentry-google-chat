# DigitalOcean App Platform spec.
# Create:  doctl apps create --spec .do/app.yaml
# Update:  doctl apps update <app-id> --spec .do/app.yaml
# Set the real SECRET values in the App Platform dashboard (or via an encrypted
# spec) after the first deploy — the placeholders below only let it boot.
name: sentry-google-chat
region: blr # change to your nearest: nyc, ams, fra, lon, sfo, sgp, syd, tor
services:
  - name: web
    # Update to your GitHub repo (App Platform builds from this on push).
    github:
      repo: raisedadead/sentry-google-chat
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    # Keep at 1: the delivery queue, rate limiter, and idempotency cache are
    # in-process. Scaling out needs a durable queue (see README Limitations).
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /healthz
      initial_delay_seconds: 5
      period_seconds: 10
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: info
      - key: SENTRY_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: replace-with-sentry-client-secret
      - key: GCHAT_WEBHOOK_DEFAULT
        scope: RUN_TIME
        type: SECRET
        value: https://chat.googleapis.com/v1/spaces/REPLACE/messages?key=REPLACE&token=REPLACE
      - key: GCHAT_ROUTES
        scope: RUN_TIME
        type: SECRET
        value: '{}'
      - key: SENTRY_DSN
        scope: RUN_TIME
        type: SECRET
        value: ''
