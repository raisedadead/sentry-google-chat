# Template ingress. Replace the host and TLS secret, and set annotations for
# your ingress controller. Sentry posts to https://<host>/sentry/webhook.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentry-google-chat
  labels:
    app: sentry-google-chat
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - sentry-google-chat.example.com
      secretName: sentry-google-chat-tls
  rules:
    - host: sentry-google-chat.example.com
      http:
        paths:
          - path: /sentry/webhook
            pathType: Exact
            backend:
              service:
                name: sentry-google-chat
                port:
                  number: 80
